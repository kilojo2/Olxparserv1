{% extends "base.html" %}

{% block title %}Агрегатор — свіжі оголошення{% endblock %}

{% block content %}
<section class="summary">
  <p>
    Знайдено <strong id="count">0</strong> оголошень
    · <span id="countdown" class="countdown">До оновлення: —</span>
    <button id="run-now" class="btn" type="button">▶ Запустити зараз</button>
    <span id="status" class="status"></span>
  </p>
</section>

<section class="filters">
  <div class="filter-group">
    <label for="f-currency">Валюта</label>
    <select id="f-currency"><option value="">Всі</option></select>
  </div>
  <div class="filter-group">
    <label for="f-min-price">Ціна від</label>
    <input type="number" id="f-min-price" min="0" placeholder="0">
  </div>
  <div class="filter-group">
    <label for="f-max-price">Ціна до</label>
    <input type="number" id="f-max-price" min="0" placeholder="∞">
  </div>
  <div class="filter-group">
    <label for="f-rooms">Кімнат</label>
    <select id="f-rooms"><option value="">Всі</option></select>
  </div>
  <div class="filter-group">
    <label for="f-district">Район</label>
    <select id="f-district"><option value="">Всі</option></select>
  </div>
  <div class="filter-group">
    <label for="f-date-from">Дата від</label>
    <input type="date" id="f-date-from">
  </div>
  <div class="filter-group">
    <label for="f-date-to">Дата до</label>
    <input type="date" id="f-date-to">
  </div>
  <div class="filter-group">
    <label for="f-q">Пошук</label>
    <input type="text" id="f-q" placeholder="Текст у заголовку">
  </div>
  <button id="f-reset" class="btn btn-secondary" type="button">Скинути</button>
</section>

<section class="table-wrap">
  <table id="listings">
    <thead>
      <tr>
        <th>Джерело</th>
        <th>Оголошення</th>
        <th>Ціна</th>
        <th>Кімнат</th>
        <th>Площа</th>
        <th>Район</th>
        <th>Опубліковано</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="empty">Немає оголошень за обраними фільтрами.</p>
</section>
<script src="/static/app.js"></script>
{% endblock %}
