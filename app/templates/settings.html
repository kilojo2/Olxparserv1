{% extends "base.html" %}
{% block title %}Настройки Telegram{% endblock %}
{% block content %}
<h2>Настройки Telegram</h2>

<section class="settings-section">
  <h3>1. API приложения (my.telegram.org)</h3>
  <div class="settings-row">
    <input type="number" id="tg-api-id" placeholder="API ID">
    <input type="text" id="tg-api-hash" placeholder="API Hash">
    <button id="save-app" class="btn">Сохранить</button>
  </div>
</section>

<section class="settings-section">
  <h3>2. Подключение аккаунта</h3>
  <div id="tg-status" class="tg-status">Проверка…</div>
  <div class="settings-row">
    <input type="text" id="tg-phone" placeholder="+380...">
    <button id="send-code" class="btn">Отправить код</button>
    <button id="send-sms" class="btn btn-secondary">Отправить по SMS</button>
  </div>
  <div class="settings-row">
    <input type="text" id="tg-code" placeholder="Код из Telegram">
    <button id="verify-code" class="btn">Подтвердить код</button>
  </div>
  <div class="settings-row">
    <input type="password" id="tg-2fa" placeholder="Пароль 2FA (если есть)">
    <button id="verify-password" class="btn">Подтвердить пароль</button>
  </div>
</section>

<section class="settings-section">
  <h3>3. Каналы</h3>
  <textarea id="tg-channels" rows="4" placeholder="@kanal1, https://t.me/kanal2"></textarea>
  <label class="checkbox"><input type="checkbox" id="tg-enabled"> Включить парсинг Telegram</label>
  <button id="save-channels" class="btn">Сохранить</button>
</section>

<p id="settings-msg" class="status"></p>
<script src="/static/settings.js"></script>
{% endblock %}
